spring:
  datasource:
    url: jdbc:h2:mem:expsplittest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  issuer: expsplit-auth
  jwks-uri: http://localhost:9999/unused-in-tests.json
