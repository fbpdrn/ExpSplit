server:
  port: 8082

spring:
  application:
    name: expsplit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expsplit}
    username: ${DB_USERNAME:expsplit_app}
    password: ${DB_PASSWORD:expsplit_app}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  issuer: expsplit-auth
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
