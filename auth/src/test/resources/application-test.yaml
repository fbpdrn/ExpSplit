spring:
  datasource:
    url: jdbc:h2:mem:authtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  key-store-path: ${java.io.tmpdir}/expsplit-auth-test/jwt-signing-key.json
